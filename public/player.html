<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UniplayOS · native player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/enhance.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #1f1f1f;
      --text: #e8e8e8;
      --muted: #777;
      --accent: #c8ff00;
      --ctrl-h: 48px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    #wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 900px;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--up-shadow-lg, 0 24px 70px rgba(0,0,0,0.6));
      border: 1px solid var(--up-border-soft, rgba(255,255,255,0.06));
      display: flex;
      flex-direction: column;
      animation: up-scale-in 0.5s var(--up-ease-soft, cubic-bezier(0.22,1,0.36,1)) both;
    }

    #stage {
      position: relative;
      width: 100%;
      background: #000;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
    }

    #stage video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    #stage #embed-frame {
      width: 100%;
      height: 100%;
      display: none;
    }

    #stage #embed-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #thumbnail {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    #thumbnail.visible { display: block; }

    #stage.paused #overlay { z-index: 2; }

    #loader {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 20;
      pointer-events: none;
    }
    #loader.active {
      display: flex;
    }

    .uniplayos-spinner {
      width: 64px;
      height: 64px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .uniplayos-spinner .ring {
      position: absolute;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--accent);
      border-bottom-color: var(--up-accent-2, #33e6c9);
      filter: drop-shadow(0 0 6px var(--up-accent-dim, rgba(200,255,0,0.25)));
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      will-change: transform;
    }

    .uniplayos-spinner .ring:nth-child(1) {
      width: 64px;
      height: 64px;
      animation-duration: 1.2s;
      border-width: 4px;
    }
    .uniplayos-spinner .ring:nth-child(2) {
      width: 44px;
      height: 44px;
      animation-duration: 0.9s;
      border-width: 3px;
      border-top-color: #fff;
      border-bottom-color: #fff;
    }
    .uniplayos-spinner .ring:nth-child(3) {
      width: 24px;
      height: 24px;
      animation-duration: 0.6s;
      border-width: 3px;
      border-top-color: var(--accent);
      border-bottom-color: var(--up-accent-2, #33e6c9);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    #play-big {
      width: 76px;
      height: 76px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--accent);
      background: rgba(10,10,13,0.55);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      cursor: pointer;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.25s var(--up-ease-soft, ease), transform 0.3s var(--up-ease-spring, cubic-bezier(.34,1.56,.64,1)), box-shadow 0.3s ease, background 0.3s ease;
      transform: scale(0.85);
    }

    #stage.paused #play-big {
      opacity: 1;
      transform: scale(1);
    }

    #play-big:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 1px var(--accent), 0 20px 50px -14px var(--up-accent-dim, rgba(200,255,0,0.25));
      background: rgba(200,255,0,0.08);
    }

    #controls {
      background: linear-gradient(180deg, rgba(10,10,13,0.55), rgba(8,8,11,0.96));
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0.55rem 0.85rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex-shrink: 0;
      position: relative;
    }

    #quality-menu,
    #subs-menu {
      position: absolute;
      right: 0.85rem;
      bottom: calc(100% + 0.4rem);
      min-width: 112px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 0.25rem;
      background: rgba(16, 16, 22, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
      z-index: 6;
      display: flex;
      flex-direction: column;
    }

    #quality-menu .q-item,
    #subs-menu .q-item {
      justify-content: flex-start;
      width: 100%;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    #quality-menu .q-item.active,
    #subs-menu .q-item.active,
    #btn-subs.active { color: var(--accent); }

    #progress-wrap {
      position: relative;
      height: 5px;
      background: var(--border);
      cursor: pointer;
      border-radius: 4px;
      transition: height 0.15s var(--up-ease, ease);
      display: flex;
      align-items: center;
    }

    #progress-wrap:hover {
      height: 7px;
    }

    #progress-wrap input[type="range"] {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      margin: 0;
      padding: 0;
      top: 0;
      left: 0;
      z-index: 2;
    }

    #progress-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(200, 255, 0, 0.4), 0 0 0 3px rgba(255,255,255,0.06);
      transition: transform 0.18s var(--up-ease-spring, cubic-bezier(.34,1.56,.64,1));
      margin-top: -4.5px;
    }

    #progress-wrap input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    #progress-wrap input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 12px rgba(200, 255, 0, 0.4);
    }

    #progress-wrap input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.3);
    }

    #progress-wrap input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
    }

    #progress-wrap input[type="range"]::-moz-range-track {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
    }

    #progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--up-accent-2, #33e6c9));
      box-shadow: 0 0 10px rgba(200, 255, 0, 0.35);
      width: 0%;
      pointer-events: none;
      border-radius: 4px;
      z-index: 1;
      transition: width 0.08s linear;
    }

    #ctrl-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: var(--ctrl-h);
      flex-wrap: nowrap;
      width: 100%;
    }

    button {
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.3rem 0.45rem;
      letter-spacing: 0.03em;
      transition: color 0.2s var(--up-ease, ease), transform 0.2s var(--up-ease-spring, cubic-bezier(.34,1.56,.64,1)), background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    button:hover {
      color: var(--accent);
      background: rgba(200, 255, 0, 0.08);
      transform: translateY(-1px);
    }
    button:active { transform: translateY(0) scale(0.92); }
    button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    [hidden] { display: none !important; }

    #time {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      flex-shrink: 0;
    }

    .spacer {
      flex: 1;
      min-width: 4px;
    }

    #vol {
      width: 60px;
      accent-color: var(--accent);
      background: var(--border);
      border-radius: 4px;
      height: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #btn-speed {
      font-size: 0.78rem;
      min-width: 2.6rem;
      font-variant-numeric: tabular-nums;
    }

    #debug-bar {
      display: none;
      padding: 0.5rem 0.75rem 0.75rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #debug-bar.visible {
      display: flex;
    }

    #debug-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      border-radius: 6px;
      min-width: 150px;
    }

    #debug-bar input:focus {
      border-color: var(--accent);
    }

    #debug-bar button {
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
    }

    #debug-bar button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    #status {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.25rem 0.75rem 0.5rem;
      background: var(--surface);
      min-height: 1.6rem;
      border-top: 1px solid var(--border);
      font-family: monospace;
      display: none;
      flex-shrink: 0;
    }

    #status.visible {
      display: block;
    }

    #resume-toast {
      position: absolute;
      bottom: 4.2rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(16,16,22,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--accent);
      color: var(--text);
      font-size: 0.78rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      box-shadow: 0 10px 30px -12px rgba(200,255,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--up-ease-soft, ease), transform 0.3s var(--up-ease-soft, ease);
      white-space: nowrap;
      z-index: 5;
    }

    #resume-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #stage.fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
      z-index: 9999;
      aspect-ratio: auto !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 0;
    }

    #stage.fullscreen video {
      object-fit: contain;
      width: 100vw;
      height: 100vh;
    }

    #stage.fullscreen #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.85));
      backdrop-filter: blur(10px) saturate(150%);
      -webkit-backdrop-filter: blur(10px) saturate(150%);
      border-top: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    #stage.fullscreen #ctrl-row {
      width: 100%;
      flex-wrap: nowrap;
      gap: 0.5rem;
    }

    #stage.fullscreen #debug-bar,
    #stage.fullscreen #status {
      display: none !important;
    }

    :root[data-theme="light"] {
      --bg: #eef0f4;
      --surface: #ffffff;
      --border: #d5d9e0;
      --text: #15171c;
      --muted: #5a6070;
      --accent: #3d7a00;
      --up-accent-2: #0c8f7b;
      --up-accent-dim: rgba(61, 122, 0, 0.18);
      --up-border-soft: rgba(15, 20, 35, 0.1);
      --up-shadow-lg: 0 24px 70px rgba(20, 24, 40, 0.16);
    }

    :root[data-theme="light"] #controls {
      background: linear-gradient(180deg, #ffffff, #f2f4f7);
      border-top-color: var(--border);
    }

    :root[data-theme="light"] #quality-menu,
    :root[data-theme="light"] #subs-menu {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 40px -12px rgba(20, 24, 40, 0.25);
    }

    :root[data-theme="light"] #resume-toast {
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px -12px rgba(20, 24, 40, 0.25);
    }

    :root[data-theme="light"] #play-big {
      color: #c8ff00;
    }

    :root[data-theme="light"] #stage.fullscreen {
      --text: #e8e8e8;
      --muted: #b4b8c2;
      --accent: #c8ff00;
      --border: #1f1f1f;
      --up-accent-2: #33e6c9;
    }

    :root[data-theme="light"] #stage.fullscreen #controls {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.85));
      border-top-color: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] #stage.fullscreen #quality-menu,
    :root[data-theme="light"] #stage.fullscreen #subs-menu {
      background: rgba(16, 16, 22, 0.96);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 1024px) {
      #wrapper {
        max-height: 900px;
        height: 90vh;
      }
      #stage {
        aspect-ratio: 16 / 9;
        flex: 1;
        min-height: 0;
      }
      #ctrl-row {
        gap: 0.75rem;
      }
      button {
        font-size: 1.1rem;
        padding: 0.3rem 0.6rem;
      }
      #time {
        font-size: 0.9rem;
        min-width: 100px;
      }
      #vol {
        width: 80px;
      }
      #play-big {
        width: 80px;
        height: 80px;
        font-size: 2rem;
      }
    }

    @media (max-width: 768px) {
      #wrapper {
        max-height: 100vh;
        height: 100%;
        border-radius: 0;
      }
      #stage {
        aspect-ratio: 16 / 9;
      }
    }

    @media (max-width: 600px) {
      #ctrl-row,
      #stage.fullscreen #ctrl-row {
        flex-wrap: wrap;
        height: auto;
        min-height: var(--ctrl-h);
        gap: 0.3rem;
        row-gap: 0.15rem;
      }
      #vol { width: 45px; }
      #time { font-size: 0.7rem; min-width: 75px; }
      #play-big { width: 56px; height: 56px; font-size: 1.4rem; }
      #progress-wrap input[type="range"]::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -5.5px;
      }
      #progress-wrap input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
      }
      #debug-bar {
        padding: 0.4rem 0.5rem 0.6rem;
      }
      #debug-bar input {
        font-size: 0.7rem;
        padding: 0.4rem 0.6rem;
      }
      #debug-bar button {
        padding: 0.4rem 0.8rem;
        font-size: 0.7rem;
      }
    }

    @media (max-width: 480px) {
      #progress-wrap input[type="range"]::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
        margin-top: -4.5px;
      }
      #progress-wrap input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
      }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #stage.fullscreen #ctrl-row {
        gap: 0.2rem;
      }
      #stage.fullscreen #time {
        min-width: 60px;
        font-size: 0.65rem;
      }
      #stage.fullscreen #vol {
        width: 40px;
      }
      #stage.fullscreen button {
        font-size: 0.8rem;
        padding: 0.2rem 0.3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<div id="wrapper">
  <div id="stage" class="paused">
    <video id="video" playsinline></video>
    <img id="thumbnail" alt="">
    <div id="embed-frame"></div>

    <div id="loader">
      <div class="uniplayos-spinner">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>
    </div>

    <div id="overlay">
      <button id="play-big" aria-label="Play"><i class="fa-solid fa-play"></i></button>
    </div>

    <div id="resume-toast"></div>
  </div>

  <div id="controls">
    <div id="quality-menu" role="menu" hidden></div>
    <div id="subs-menu" role="menu" hidden></div>
    <div id="progress-wrap" role="slider" aria-label="Seek" tabindex="0">
      <div id="progress-fill"></div>
      <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.01" aria-label="Seek">
    </div>
    <div id="ctrl-row">
      <button id="btn-prev" aria-label="Previous" hidden><i class="fa-solid fa-backward-fast"></i></button>
      <button id="btn-play" aria-label="Play/Pause"><i class="fa-solid fa-play"></i></button>
      <button id="btn-rewind" aria-label="Rewind 10s"><i class="fa-solid fa-backward-step"></i></button>
      <button id="btn-forward" aria-label="Forward 10s"><i class="fa-solid fa-forward-step"></i></button>
      <button id="btn-next" aria-label="Next" hidden><i class="fa-solid fa-forward-fast"></i></button>
      <span id="time">0:00 / 0:00</span>
      
      <div class="spacer"></div>
      
      <button id="btn-subs" aria-label="Subtitles" hidden><i class="fa-solid fa-closed-captioning"></i></button>
      <button id="btn-quality" aria-label="Quality" hidden>Auto</button>
      <button id="btn-speed" aria-label="Playback speed">1x</button>
      <button id="btn-mute" aria-label="Mute"><i class="fa-solid fa-volume-high"></i></button>
      <input id="vol" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume">
      <button id="btn-download" aria-label="Download"><i class="fa-solid fa-download"></i></button>
      <button id="btn-fs" aria-label="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>

  <div id="debug-bar">
    <input id="url-input" type="url" placeholder="Paste video URL (MP4, HLS, DASH, YouTube…)" spellcheck="false">
    <button id="url-load">Load</button>
  </div>
  <div id="status">Ready</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://player.vimeo.com/api/player.js"></script>
<script src="/js/utils/utils.js"></script>
<script src="/js/utils/resolver.js"></script>
<script src="/js/utils/api.js"></script>
<script src="/js/utils/storage.js"></script>
<script src="/js/utils/download.js"></script>

<script>
  (function() {
    const video = document.getElementById('video');
    const stage = document.getElementById('stage');
    const embedFrame  = document.getElementById('embed-frame');
    const thumbnail   = document.getElementById('thumbnail');
    const btnPlay = document.getElementById('btn-play');
    const btnRewind = document.getElementById('btn-rewind');
    const btnForward = document.getElementById('btn-forward');
    const playBig = document.getElementById('play-big');
    const btnMute = document.getElementById('btn-mute');
    const btnFs = document.getElementById('btn-fs');
    const btnDownload = document.getElementById('btn-download');
    const btnSpeed = document.getElementById('btn-speed');
    const progress = document.getElementById('progress-fill');
    const progWrap = document.getElementById('progress-wrap');
    const seekSlider = document.getElementById('seek-slider');
    const timeEl = document.getElementById('time');
    const volSlider = document.getElementById('vol');
    const urlInput = document.getElementById('url-input');
    const urlLoad = document.getElementById('url-load');
    const status = document.getElementById('status');
    const debugBar = document.getElementById('debug-bar');
    const loader = document.getElementById('loader');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnQuality = document.getElementById('btn-quality');
    const qualityMenu = document.getElementById('quality-menu');
    const btnSubs = document.getElementById('btn-subs');
    const subsMenu = document.getElementById('subs-menu');
    const controlsEl = document.getElementById('controls');
    const wrapperEl = document.getElementById('wrapper');

    let hlsInstance = null;
    let dashInstance = null;
    let ytPlayer = null;
    let vimeoPlayer = null;
    let playbackMode = 'native';
    let knownDuration = 0;
    let embedPollTimer = null;
    const PLAYBACK_SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
    let currentSpeed = 1;
    let isReadySent = false;
    let isSeeking = false;
    let isDebugMode = false;
    let loadTimeout = null;
    let waitingTimeout = null;
    let mediaReady = false;
    let listenerAbort = null;
    let playlist = [];
    let playlistIndex = 0;
    let quality = null;
    let lastQualityPayload = '';
    const QUALITY_KEY = 'quality';
    const SUBTITLE_KEY = 'subtitle';
    const subtitleState = { tracks: [], selected: 'off', autoApplied: false, loadId: 0 };
    let lastSubtitleTracksPayload = '';
    let lastSubtitleChangePayload = '';
    let playlistSubtitles = [];
    let pendingSubtitles = [];

    const HISTORY_KEY = 'history';
    const HISTORY_MAX_ENTRIES = 50;
    const RESUME_MIN_POSITION = 5;
    const RESUME_END_BUFFER = 15;
    const HISTORY_SAVE_INTERVAL_MS = 5000;

    const resumeToast = document.getElementById('resume-toast');
    let currentSourceUrl = null;
    let lastHistorySaveAt = 0;
    let resumeToastTimer = null;

    let ytApiReady = typeof window.YT !== 'undefined' && !!window.YT.Player;
    let ytApiReadyResolvers = [];
    window.onYouTubeIframeAPIReady = function() {
      ytApiReady = true;
      ytApiReadyResolvers.forEach((resolve) => resolve());
      ytApiReadyResolvers = [];
    };
    function whenYouTubeApiReady() {
      return new Promise((resolve) => {
        if (ytApiReady) return resolve();
        ytApiReadyResolvers.push(resolve);
      });
    }

    function getHistory() {
      return Storage.get(HISTORY_KEY, []);
    }

    function getHistoryEntry(url) {
      return getHistory().find((entry) => entry.url === url) || null;
    }

    function saveHistoryEntry(url, position, duration) {
      if (!url || !duration || !isFinite(duration)) return;
      const list = getHistory().filter((entry) => entry.url !== url);
      list.unshift({ url, position, duration, updatedAt: Date.now() });
      Storage.set(HISTORY_KEY, list.slice(0, HISTORY_MAX_ENTRIES));
    }

    function removeHistoryEntry(url) {
      Storage.set(HISTORY_KEY, getHistory().filter((entry) => entry.url !== url));
    }

    function showResumeToast(position) {
      if (!resumeToast) return;
      resumeToast.textContent = `Resumed from ${Utils.formatTime(position)}`;
      resumeToast.classList.add('visible');
      if (resumeToastTimer) clearTimeout(resumeToastTimer);
      resumeToastTimer = setTimeout(() => resumeToast.classList.remove('visible'), 2500);
    }

    function showToast(message, holdMs = 2500) {
      if (!resumeToast) return;
      resumeToast.textContent = message;
      resumeToast.classList.add('visible');
      if (resumeToastTimer) clearTimeout(resumeToastTimer);
      if (holdMs) resumeToastTimer = setTimeout(() => resumeToast.classList.remove('visible'), holdMs);
    }

    function applyResumeIfNeeded(url, resumeState, seek) {
      const entry = getHistoryEntry(url);
      if (!entry) return;
      if (entry.position < RESUME_MIN_POSITION) return;
      if (entry.duration && entry.position > entry.duration - RESUME_END_BUFFER) {
        removeHistoryEntry(url);
        return;
      }
      seek(entry.position);
      showResumeToast(entry.position);
    }

    function maybeResume(url) {
      applyResumeIfNeeded(url, null, (position) => { video.currentTime = position; });
    }

    function persistProgress(force = false) {
      if (!currentSourceUrl || !video.duration || !isFinite(video.duration)) return;
      const now = Date.now();
      if (!force && now - lastHistorySaveAt < HISTORY_SAVE_INTERVAL_MS) return;
      lastHistorySaveAt = now;
      saveHistoryEntry(currentSourceUrl, video.currentTime, video.duration);
    }

    function showLoader(show) {
      loader.classList.toggle('active', show);
    }

    function setStatus(msg) {
      status.textContent = msg;
      status.classList.toggle('visible', !!msg && isDebugMode);
    }

    function detectParentOrigin() {
      try {
        if (location.ancestorOrigins && location.ancestorOrigins.length) {
          const origin = location.ancestorOrigins[0];
          if (/^https?:\/\//.test(origin)) return origin;
        }
      } catch (err) {}
      try {
        if (document.referrer) {
          const origin = new URL(document.referrer).origin;
          if (/^https?:\/\//.test(origin)) return origin;
        }
      } catch (err) {}
      return null;
    }

    let parentOrigin = detectParentOrigin();

    function sendEmbedEvent(action, payload = {}) {
      if (window.parent === window) return;
      try {
        window.parent.postMessage({ type: 'uniplayos', action, ...payload }, parentOrigin || '*');
      } catch (err) {}
    }

    function sendReadyIfNeeded() {
      if (!isReadySent) {
        isReadySent = true;
        sendEmbedEvent('ready');
      }
    }

    function updateAspectRatio() {
      if (!video.videoWidth || !video.videoHeight) return;
      const w = video.videoWidth;
      const h = video.videoHeight;
      stage.style.aspectRatio = `${w} / ${h}`;
    }

    function setPlayingUI(isPlaying) {
      stage.classList.toggle('paused', !isPlaying);
      setIcon(btnPlay, isPlaying ? 'pause' : 'play');
      setIcon(playBig, isPlaying ? 'pause' : 'play');
    }

    function updateTimeUI(currentTime, duration) {
      if (!duration || !isFinite(duration)) return;
      knownDuration = duration;
      const pct = (currentTime / duration) * 100;
      progress.style.width = pct + '%';
      if (!isSeeking) seekSlider.value = pct;
      timeEl.textContent = `${Utils.formatTime(currentTime)} / ${Utils.formatTime(duration)}`;
    }

    function stopEmbedPolling() {
      if (embedPollTimer) { clearInterval(embedPollTimer); embedPollTimer = null; }
    }

    function startEmbedPolling(getState) {
      stopEmbedPolling();
      embedPollTimer = setInterval(async () => {
        const state = await getState();
        if (!state || !state.duration) return;
        updateTimeUI(state.currentTime, state.duration);
        sendEmbedEvent('timeupdate', { currentTime: state.currentTime, duration: state.duration });
        if (currentSourceUrl) {
          const now = Date.now();
          if (now - lastHistorySaveAt >= HISTORY_SAVE_INTERVAL_MS) {
            lastHistorySaveAt = now;
            saveHistoryEntry(currentSourceUrl, state.currentTime, state.duration);
          }
        }
      }, 500);
    }

    function qualityLabel(level) {
      return level.height ? `${level.height}p` : `${Math.round(level.bitrate / 1000)} kbps`;
    }

    function buildQualityEntries(rawLevels) {
      const byLabel = new Map();
      rawLevels.forEach((level, index) => {
        const entry = { index, height: level.height || 0, bitrate: level.bitrate || 0 };
        entry.label = qualityLabel(entry);
        const existing = byLabel.get(entry.label);
        if (!existing || entry.bitrate > existing.bitrate) byLabel.set(entry.label, entry);
      });
      return [...byLabel.values()].sort((a, b) => (b.height - a.height) || (b.bitrate - a.bitrate));
    }

    const popupMenus = [
      { menu: qualityMenu, button: btnQuality },
      { menu: subsMenu, button: btnSubs },
    ];

    function closeMenus() {
      popupMenus.forEach((entry) => { entry.menu.hidden = true; });
    }

    function toggleMenu(entry) {
      const opening = entry.menu.hidden;
      closeMenus();
      if (!opening) return;
      const buttonBox = entry.button.getBoundingClientRect();
      const controlsBox = controlsEl.getBoundingClientRect();
      entry.menu.style.right = `${Math.max(0, controlsBox.right - buttonBox.right)}px`;
      entry.menu.hidden = false;
    }

    function renderOptionMenu(menu, items, selected, onPick) {
      menu.innerHTML = '';
      items.forEach((item) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = item.value === selected ? 'q-item active' : 'q-item';
        option.textContent = item.text;
        option.addEventListener('click', () => onPick(item.value));
        menu.appendChild(option);
      });
    }

    function normalizeSubtitles(list) {
      if (!Array.isArray(list)) return [];
      return list
        .map((item) => (typeof item === 'string' ? { src: item } : item))
        .filter((item) => item && typeof (item.src || item.url) === 'string')
        .map((item) => ({
          src: (item.src || item.url).trim(),
          lang: item.lang || item.srclang || '',
          label: item.label || item.lang || item.srclang || 'Subtitles',
          isDefault: item.default === true,
        }))
        .filter((item) => item.src);
    }

    function subtitleFetchUrl(src) {
      try {
        const parsed = new URL(src, location.href);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
        return parsed.origin === location.origin
          ? parsed.href
          : `/proxy?url=${encodeURIComponent(parsed.href)}`;
      } catch {
        return null;
      }
    }

    function disposeExternalTracks(tracks) {
      tracks.forEach((track) => {
        if (track.kind !== 'ext' || !track.element) return;
        const blobUrl = track.element.src;
        track.element.remove();
        if (blobUrl) URL.revokeObjectURL(blobUrl);
      });
    }

    function applySubtitle(key) {
      const target = subtitleState.tracks.find((track) => track.key === key);
      if (hlsInstance) {
        hlsInstance.subtitleDisplay = true;
        hlsInstance.subtitleTrack = target && target.kind === 'hls' ? target.ref : -1;
      }
      if (dashInstance) {
        const useDash = Boolean(target && target.kind === 'dash');
        dashInstance.enableText(useDash);
        if (useDash) dashInstance.setTextTrack(target.ref);
      }
      subtitleState.tracks.forEach((track) => {
        if (track.kind === 'ext') track.element.track.mode = track === target ? 'showing' : 'disabled';
      });
    }

    function emitSubtitleChange() {
      const target = subtitleState.tracks.find((track) => track.key === subtitleState.selected);
      const payload = JSON.stringify([target ? target.lang : null, target ? target.label : null]);
      if (payload === lastSubtitleChangePayload) return;
      lastSubtitleChangePayload = payload;
      sendEmbedEvent('subtitlechange', { lang: target ? target.lang : null, label: target ? target.label : null });
    }

    function renderSubtitles() {
      const hasTracks = subtitleState.tracks.length > 0;
      btnSubs.hidden = !hasTracks;
      btnSubs.classList.toggle('active', subtitleState.selected !== 'off');
      if (!hasTracks) {
        subsMenu.hidden = true;
        subsMenu.innerHTML = '';
        return;
      }
      const items = [{ value: 'off', text: 'Off' }]
        .concat(subtitleState.tracks.map((track) => ({ value: track.key, text: track.label })));
      renderOptionMenu(subsMenu, items, subtitleState.selected, (value) => {
        selectSubtitle(value, true);
        closeMenus();
      });
    }

    function selectSubtitle(key, persist) {
      const target = subtitleState.tracks.find((track) => track.key === key);
      subtitleState.selected = target ? key : 'off';
      subtitleState.autoApplied = true;
      applySubtitle(subtitleState.selected);
      if (persist) Storage.set(SUBTITLE_KEY, target ? target.pref : 'off');
      renderSubtitles();
      emitSubtitleChange();
    }

    function maybeAutoSelectSubtitle() {
      if (subtitleState.autoApplied || subtitleState.selected !== 'off') return;
      const saved = Storage.get(SUBTITLE_KEY, null);
      let target = null;
      if (saved && saved !== 'off') target = subtitleState.tracks.find((track) => track.pref === saved);
      if (!target && saved === null) target = subtitleState.tracks.find((track) => track.isDefault);
      if (target) selectSubtitle(target.key, false);
    }

    function setTracksOfKind(kind, list) {
      const kept = subtitleState.tracks.filter((track) => track.kind !== kind);
      const added = list.map((track, index) => ({
        key: `${kind}:${index}`,
        kind,
        ref: track.ref,
        element: track.element,
        lang: track.lang || '',
        label: track.label || track.lang || `Track ${index + 1}`,
        pref: track.lang || track.label || `${kind}${index}`,
        isDefault: Boolean(track.isDefault),
      }));
      subtitleState.tracks = kept.concat(added);
      if (!subtitleState.tracks.some((track) => track.key === subtitleState.selected)) {
        subtitleState.selected = 'off';
      }
      renderSubtitles();
      const payload = JSON.stringify(subtitleState.tracks.map((track) => [track.lang, track.label]));
      if (payload !== lastSubtitleTracksPayload) {
        lastSubtitleTracksPayload = payload;
        if (subtitleState.tracks.length) {
          sendEmbedEvent('subtitletracks', {
            tracks: subtitleState.tracks.map((track) => ({ lang: track.lang, label: track.label })),
          });
        }
      }
      maybeAutoSelectSubtitle();
    }

    function resetSubtitles() {
      subtitleState.loadId += 1;
      disposeExternalTracks(subtitleState.tracks);
      subtitleState.tracks = [];
      subtitleState.selected = 'off';
      subtitleState.autoApplied = false;
      lastSubtitleTracksPayload = '';
      lastSubtitleChangePayload = '';
      renderSubtitles();
    }

    async function loadExternalSubtitles(list) {
      if (!list.length) return;
      const loadId = subtitleState.loadId;
      const loaded = [];
      for (const item of list) {
        const fetchUrl = subtitleFetchUrl(item.src);
        if (!fetchUrl) continue;
        try {
          const response = await fetch(fetchUrl);
          if (!response.ok) continue;
          const text = await response.text();
          if (loadId !== subtitleState.loadId) break;
          const blobUrl = URL.createObjectURL(new Blob([Utils.toWebVtt(text)], { type: 'text/vtt' }));
          const element = document.createElement('track');
          element.kind = 'subtitles';
          element.label = item.label;
          element.srclang = item.lang;
          element.src = blobUrl;
          video.appendChild(element);
          element.track.mode = 'disabled';
          loaded.push({ element, label: item.label, lang: item.lang, isDefault: item.isDefault });
        } catch (err) {}
      }
      if (loadId !== subtitleState.loadId) {
        disposeExternalTracks(loaded.map((track) => ({ kind: 'ext', element: track.element })));
        return;
      }
      if (loaded.length) setTracksOfKind('ext', loaded);
    }

    function clearQuality() {
      quality = null;
      lastQualityPayload = '';
      btnQuality.hidden = true;
      closeMenus();
      qualityMenu.innerHTML = '';
    }

    function pickEntryForHeight(height) {
      if (!quality) return null;
      const target = Number(height);
      return quality.entries.find((entry) => entry.height <= target) || quality.entries[quality.entries.length - 1];
    }

    function emitQuality() {
      if (!quality) return;
      const auto = quality.selected === 'auto';
      const selectedEntry = quality.entries.find((entry) => entry.index === quality.selected);
      const height = auto ? quality.currentHeight : selectedEntry.height;
      const payload = JSON.stringify({ auto, height });
      if (payload === lastQualityPayload) return;
      lastQualityPayload = payload;
      sendEmbedEvent('qualitychange', { auto, height });
    }

    function renderQuality() {
      if (!quality) return;
      const auto = quality.selected === 'auto';
      const selectedEntry = quality.entries.find((entry) => entry.index === quality.selected);
      btnQuality.hidden = false;
      btnQuality.textContent = auto ? 'Auto' : selectedEntry.label;

      const items = [{ value: 'auto', text: auto && quality.currentLabel ? `Auto (${quality.currentLabel})` : 'Auto' }]
        .concat(quality.entries.map((entry) => ({ value: entry.index, text: entry.label })));

      renderOptionMenu(qualityMenu, items, quality.selected, (value) => {
        selectQuality(value, true);
        closeMenus();
      });
    }

    function selectQuality(value, persist) {
      if (!quality) return;
      quality.selected = value;
      quality.apply(value === 'auto' ? -1 : value);
      if (persist) {
        const entry = quality.entries.find((item) => item.index === value);
        Storage.set(QUALITY_KEY, value === 'auto' ? 'auto' : entry.height);
      }
      renderQuality();
      emitQuality();
    }

    function updateCurrentQuality(rawIndex) {
      if (!quality) return;
      const label = quality.rawLabels[rawIndex];
      if (!label || label === quality.currentLabel) return;
      quality.currentLabel = label;
      quality.currentHeight = quality.rawHeights[rawIndex];
      renderQuality();
      emitQuality();
    }

    function setupQuality(rawLevels, apply) {
      const entries = buildQualityEntries(rawLevels);
      if (entries.length < 2) {
        clearQuality();
        return;
      }
      quality = {
        entries,
        apply,
        selected: 'auto',
        currentLabel: null,
        currentHeight: null,
        rawLabels: rawLevels.map(qualityLabel),
        rawHeights: rawLevels.map((level) => level.height || 0),
      };
      const saved = Storage.get(QUALITY_KEY, 'auto');
      if (saved !== 'auto') {
        const target = pickEntryForHeight(saved);
        if (target) {
          selectQuality(target.index, false);
        }
      }
      renderQuality();
      sendEmbedEvent('qualitylevels', { heights: entries.map((entry) => entry.height) });
    }

    function enterFullscreenLayout() {
      stage.classList.add('fullscreen');
      if (controlsEl.parentNode !== stage) stage.appendChild(controlsEl);
    }

    function exitFullscreenLayout() {
      stage.classList.remove('fullscreen');
      if (controlsEl.parentNode !== wrapperEl) wrapperEl.insertBefore(controlsEl, debugBar);
      closeMenus();
      updateAspectRatio();
    }

    function toggleFullscreenMode() {
      if (document.fullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        return;
      }
      if (stage.classList.contains('fullscreen')) {
        exitFullscreenLayout();
        return;
      }
      enterFullscreenLayout();
      if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
    }

    function destroyInstances() {
      clearQuality();
      setTracksOfKind('hls', []);
      setTracksOfKind('dash', []);
      if (listenerAbort) { listenerAbort.abort(); listenerAbort = null; }
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (dashInstance) { dashInstance.reset(); dashInstance = null; }
      video.removeAttribute('src');
      video.load();
      stopEmbedPolling();
      if (ytPlayer) {
        try { ytPlayer.destroy(); } catch (err) {}
        ytPlayer = null;
      }
      if (vimeoPlayer) {
        try { vimeoPlayer.destroy(); } catch (err) {}
        vimeoPlayer = null;
      }
      embedFrame.innerHTML = '';
      playbackMode = 'native';
      knownDuration = 0;
    }

    function showVideo() {
      video.style.display = 'block';
      embedFrame.style.display = 'none';
    }
    function showEmbed() {
      video.style.display = 'none';
      embedFrame.style.display = 'block';
    }

    const YT_THUMB_FALLBACKS = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];

    function setThumbnail(url) {
      if (!url) { thumbnail.classList.remove('visible'); thumbnail.src = ''; return; }

      const ytMatch = url.match(/img\.youtube\.com\/vi\/([^/]+)\/(\w+)\.jpg/);
      thumbnail.onerror = null;

      if (ytMatch) {
        const [, videoId] = ytMatch;
        let step = 0;
        thumbnail.onerror = () => {
          step += 1;
          if (step < YT_THUMB_FALLBACKS.length) {
            thumbnail.src = `https://img.youtube.com/vi/${videoId}/${YT_THUMB_FALLBACKS[step]}.jpg`;
          } else {
            thumbnail.onerror = null;
            thumbnail.classList.remove('visible');
          }
        };
      }

      thumbnail.src = url;
      thumbnail.classList.add('visible');
    }

    function clearThumbnail() {
      thumbnail.classList.remove('visible');
    }

    function safePlay() {
      const p = video.play();
      if (p !== undefined) p.catch(() => {});
    }

    function loadYouTube(rawUrl, autoplay, resumeState) {
      const videoId = Utils.extractYouTubeId(rawUrl);
      if (!videoId) {
        showLoader(false);
        if (loadTimeout) clearTimeout(loadTimeout);
        if (isDebugMode) setStatus('Invalid YouTube URL');
        return;
      }

      whenYouTubeApiReady().then(() => {
        if (currentSourceUrl !== rawUrl) return;
        ytPlayer = new YT.Player(embedFrame, {
          videoId,
          width: '100%',
          height: '100%',
          playerVars: { autoplay: autoplay ? 1 : 0, playsinline: 1 },
          events: {
            onReady: () => {
              showLoader(false);
              if (loadTimeout) clearTimeout(loadTimeout);
              if (isDebugMode) setStatus('');
              sendReadyIfNeeded();
              knownDuration = ytPlayer.getDuration();
              applyCurrentSpeed();
              if (!resumeState.attempted) {
                resumeState.attempted = true;
                applyResumeIfNeeded(rawUrl, resumeState, (position) => ytPlayer.seekTo(position, true));
              }
              startEmbedPolling(() => ({
                currentTime: ytPlayer.getCurrentTime(),
                duration: ytPlayer.getDuration(),
              }));
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) {
                setPlayingUI(true);
                sendEmbedEvent('play');
                clearThumbnail();
              } else if (event.data === YT.PlayerState.PAUSED) {
                setPlayingUI(false);
                sendEmbedEvent('pause');
                if (currentSourceUrl) {
                  saveHistoryEntry(currentSourceUrl, ytPlayer.getCurrentTime(), ytPlayer.getDuration());
                }
              } else if (event.data === YT.PlayerState.ENDED) {
                sendEmbedEvent('ended');
                if (currentSourceUrl) removeHistoryEntry(currentSourceUrl);
                stopEmbedPolling();
                advanceAfterEnd();
              }
            },
            onError: () => {
              showLoader(false);
              if (loadTimeout) clearTimeout(loadTimeout);
              if (isDebugMode) setStatus('YouTube playback error');
              sendEmbedEvent('error', { message: 'YouTube error' });
            },
          },
        });
      });
    }

    function loadVimeo(rawUrl, autoplay, resumeState) {
      const vimeo = Utils.parseVimeo(rawUrl);
      if (!vimeo) {
        showLoader(false);
        if (loadTimeout) clearTimeout(loadTimeout);
        if (isDebugMode) setStatus('Invalid Vimeo URL');
        return;
      }

      vimeoPlayer = new Vimeo.Player(embedFrame, { ...(vimeo.hash ? { url: vimeo.url } : { id: vimeo.id }), autoplay, responsive: true });

      vimeoPlayer.on('play', () => {
        setPlayingUI(true);
        sendEmbedEvent('play');
        clearThumbnail();
      });
      vimeoPlayer.on('pause', () => {
        setPlayingUI(false);
        sendEmbedEvent('pause');
        if (currentSourceUrl && vimeoPlayer) {
          vimeoPlayer.getCurrentTime().then((t) => saveHistoryEntry(currentSourceUrl, t, knownDuration));
        }
      });
      vimeoPlayer.on('ended', () => {
        sendEmbedEvent('ended');
        if (currentSourceUrl) removeHistoryEntry(currentSourceUrl);
        stopEmbedPolling();
        advanceAfterEnd();
      });

      vimeoPlayer.ready()
        .then(() => {
          showLoader(false);
          if (loadTimeout) clearTimeout(loadTimeout);
          if (isDebugMode) setStatus('');
          sendReadyIfNeeded();
          return vimeoPlayer.getDuration();
        })
        .then((duration) => {
          knownDuration = duration || 0;
          applyCurrentSpeed();
          if (!resumeState.attempted) {
            resumeState.attempted = true;
            applyResumeIfNeeded(rawUrl, resumeState, (position) => vimeoPlayer.setCurrentTime(position));
          }
          startEmbedPolling(async () => {
            if (!vimeoPlayer) return null;
            const [currentTime, duration] = await Promise.all([
              vimeoPlayer.getCurrentTime(),
              vimeoPlayer.getDuration(),
            ]);
            return { currentTime, duration };
          });
        })
        .catch(() => {
          showLoader(false);
          if (loadTimeout) clearTimeout(loadTimeout);
          if (isDebugMode) setStatus('Failed to load Vimeo video');
          sendEmbedEvent('error', { message: 'Vimeo error' });
        });
    }

    function loadUrl(rawUrl, autoplay = false) {
      if (!rawUrl) return;
      destroyInstances();
      listenerAbort = new AbortController();
      mediaReady = false;
      isReadySent = false;
      resetSubtitles();
      loadExternalSubtitles(pendingSubtitles);
      showLoader(true);
      currentSourceUrl = null;
      lastHistorySaveAt = 0;
      const resumeState = { attempted: false };

      const thumb = Utils.getThumbnail(rawUrl);
      setThumbnail(thumb);

      if (loadTimeout) clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => {
        if (loader.classList.contains('active')) {
          if (isDebugMode) setStatus('Loading is taking longer than expected...');
        }
      }, 3000);

      try {
        const resolver = new Resolver();
        const result = resolver.resolve(rawUrl);
        const src = result.proxyRequired ? resolver.getProxyUrl(rawUrl) : rawUrl;

        if (isDebugMode) setStatus('Loading…');

        if (result.strategy === 'iframe') {
          showEmbed();
          stage.style.aspectRatio = '16 / 9';
          currentSourceUrl = rawUrl;

          if (Utils.isYouTube(rawUrl)) {
            playbackMode = 'youtube';
            loadYouTube(rawUrl, autoplay, resumeState);
          } else if (Utils.isVimeo(rawUrl)) {
            playbackMode = 'vimeo';
            loadVimeo(rawUrl, autoplay, resumeState);
          } else {
            playbackMode = 'iframe';
            embedFrame.innerHTML = '';
            const frame = document.createElement('iframe');
            frame.allowFullscreen = true;
            frame.setAttribute('allow', 'autoplay');
            frame.src = rawUrl;
            embedFrame.appendChild(frame);
            if (isDebugMode) setStatus('');
            sendReadyIfNeeded();
            showLoader(false);
            if (loadTimeout) clearTimeout(loadTimeout);
          }
          return;
        }

        showVideo();
        stage.style.aspectRatio = '16 / 9';
        currentSourceUrl = rawUrl;

        const onMediaReady = () => {
          mediaReady = true;
          showLoader(false);
          if (loadTimeout) clearTimeout(loadTimeout);
          if (isDebugMode) setStatus('');
          updateAspectRatio();
          sendReadyIfNeeded();
          applyCurrentSpeed();
          if (!resumeState.attempted) {
            resumeState.attempted = true;
            maybeResume(rawUrl);
          }
          if (autoplay) safePlay();
        };


        const onError = (msg) => {
          showLoader(false);
          if (loadTimeout) clearTimeout(loadTimeout);
          if (isDebugMode) setStatus(msg || 'Failed to load media.');
          sendEmbedEvent('error', { message: msg || 'Media error' });
        };

        let fallbackIndex = 0;

        function loadNative(srcUrl) {
          const signal = listenerAbort ? listenerAbort.signal : undefined;
          video.src = srcUrl;
          video.addEventListener('loadedmetadata', onMediaReady, { once: true, signal });
          video.addEventListener('error', () => {
            if (!mediaReady) handleFailure('Failed to load media');
          }, { once: true, signal });
          if (autoplay) safePlay();
        }

        function loadHls(srcUrl) {
          if (Hls.isSupported()) {
            const hls = new Hls();
            hlsInstance = hls;
            let networkRetries = 0;
            let mediaRetries = 0;
            hls.loadSource(srcUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, onMediaReady);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              setupQuality(hls.levels, (level) => { hls.currentLevel = level; });
            });
            hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => updateCurrentQuality(data.level));
            hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (_, data) => {
              setTracksOfKind('hls', (data.subtitleTracks || []).map((track, index) => ({
                ref: index,
                label: track.name,
                lang: track.lang,
              })));
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
              if (!data.fatal) return;
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR && mediaReady && networkRetries < 3) {
                networkRetries += 1;
                hls.startLoad();
                return;
              }
              if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries < 2) {
                mediaRetries += 1;
                hls.recoverMediaError();
                return;
              }
              handleFailure('HLS fatal error');
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            loadNative(srcUrl);
          } else {
            handleFailure('HLS not supported');
          }
        }

        function loadDash(srcUrl) {
          const dash = dashjs.MediaPlayer().create();
          dashInstance = dash;
          dash.updateSettings({ streaming: { text: { defaultEnabled: false } } });
          dash.initialize(video, srcUrl, autoplay);
          dash.on('streamInitialized', onMediaReady);
          dash.on('streamInitialized', () => {
            const list = dash.getBitrateInfoListFor('video') || [];
            setupQuality(list.map((item) => ({ height: item.height, bitrate: item.bitrate })), (level) => {
              if (level === -1) {
                dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } });
              } else {
                dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } });
                dash.setQualityFor('video', level, true);
              }
            });
          });
          const syncDashText = () => {
            const tracks = dash.getTracksFor('text') || [];
            setTracksOfKind('dash', tracks.map((track, index) => ({
              ref: index,
              label: track.labels && track.labels[0] ? track.labels[0].text : '',
              lang: track.lang,
            })));
          };
          dash.on('streamInitialized', syncDashText);
          dash.on('allTextTracksAdded', syncDashText);
          dash.on('qualityChangeRendered', (event) => {
            if (event.mediaType === 'video') updateCurrentQuality(event.newQuality);
          });
          dash.on('streamError', () => handleFailure('DASH stream error'));
        }

        function handleFailure(msg) {
          destroyInstances();
          listenerAbort = new AbortController();
          fallbackIndex += 1;
          const nextStep = result.fallbackChain[fallbackIndex];

          if (!nextStep) {
            onError(msg);
            return;
          }

          if (isDebugMode) setStatus(`${msg} — trying ${nextStep}…`);

          if (nextStep === 'proxy') {
            const proxiedSrc = resolver.getProxyUrl(rawUrl);
            if (proxiedSrc === src) { handleFailure(msg); return; }
            if (result.type === 'hls') loadHls(proxiedSrc);
            else if (result.type === 'dash') loadDash(proxiedSrc);
            else loadNative(proxiedSrc);
          } else if (nextStep === 'mp4-fallback') {
            loadNative(resolver.getProxyUrl(rawUrl));
          } else if (nextStep === 'iframe') {
            showEmbed();
            embedFrame.innerHTML = '';
            const frame = document.createElement('iframe');
            frame.allowFullscreen = true;
            frame.setAttribute('allow', 'autoplay');
            frame.src = rawUrl;
            embedFrame.appendChild(frame);
            showLoader(false);
            if (loadTimeout) clearTimeout(loadTimeout);
            if (isDebugMode) setStatus('');
            sendReadyIfNeeded();
          } else {
            onError(msg);
          }
        }

        if (result.type === 'hls') {
          loadHls(src);
        } else if (result.type === 'dash') {
          loadDash(src);
        } else {
          loadNative(src);
        }
      } catch (err) {
        showLoader(false);
        if (loadTimeout) clearTimeout(loadTimeout);
        if (isDebugMode) setStatus('Invalid URL');
        console.error('Resolver error:', err);
      }
    }

    function updateSpeedLabel() {
      btnSpeed.textContent = currentSpeed === 1 ? '1x' : `${currentSpeed}x`;
    }

    function applyCurrentSpeed() {
      if (playbackMode === 'youtube') {
        if (ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') ytPlayer.setPlaybackRate(currentSpeed);
      } else if (playbackMode === 'vimeo') {
        if (vimeoPlayer) vimeoPlayer.setPlaybackRate(currentSpeed).catch(() => {});
      } else {
        video.playbackRate = currentSpeed;
      }
    }

    function setPlaybackSpeed(speed) {
      currentSpeed = speed;
      updateSpeedLabel();
      applyCurrentSpeed();
    }

    function cycleSpeed() {
      const idx = PLAYBACK_SPEEDS.indexOf(currentSpeed);
      const next = PLAYBACK_SPEEDS[(idx + 1) % PLAYBACK_SPEEDS.length];
      setPlaybackSpeed(next);
    }

    function togglePlay() {
      if (playbackMode === 'youtube') {
        if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
        const state = ytPlayer.getPlayerState();
        if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      } else if (playbackMode === 'vimeo') {
        if (!vimeoPlayer) return;
        vimeoPlayer.getPaused().then((paused) => {
          if (paused) vimeoPlayer.play(); else vimeoPlayer.pause();
        });
      } else {
        if (video.paused) safePlay(); else video.pause();
      }
    }

    function updatePlaylistUI() {
      const multi = playlist.length > 1;
      btnPrev.hidden = !multi;
      btnNext.hidden = !multi;
      btnPrev.disabled = playlistIndex <= 0;
      btnNext.disabled = playlistIndex >= playlist.length - 1;
    }

    function playTrack(autoplay) {
      const source = playlist[playlistIndex];
      pendingSubtitles = playlistSubtitles[playlistIndex] || [];
      urlInput.value = source;
      updatePlaylistUI();
      if (playlist.length > 1) {
        sendEmbedEvent('trackchange', { index: playlistIndex, source, total: playlist.length });
      }
      loadUrl(source, autoplay);
    }

    function playNext(autoplay) {
      if (playlistIndex + 1 >= playlist.length) return;
      playlistIndex += 1;
      playTrack(autoplay);
    }

    function playPrevious() {
      if (playlistIndex <= 0) return;
      playlistIndex -= 1;
      playTrack(true);
    }

    function loadSingle(url, autoplay, subtitles) {
      if (!url) return;
      playlist = [url];
      playlistSubtitles = [subtitles || []];
      playlistIndex = 0;
      playTrack(autoplay);
    }

    function advanceAfterEnd() {
      setTimeout(() => playNext(true), 0);
    }

    function setIcon(btn, icon) {
      const i = btn.querySelector('i');
      if (i) i.className = `fa-solid fa-${icon}`;
    }

    function setDebugMode(enabled) {
      isDebugMode = enabled;
      debugBar.classList.toggle('visible', enabled);
      status.classList.toggle('visible', enabled && status.textContent);
      if (!enabled) setStatus('');
    }

    video.addEventListener('loadedmetadata', () => {
      updateAspectRatio();
      sendReadyIfNeeded();
      showLoader(false);
      if (loadTimeout) clearTimeout(loadTimeout);
    });

    video.addEventListener('play', () => {
      setPlayingUI(true);
      sendEmbedEvent('play');
      clearThumbnail();
    });
    video.addEventListener('pause', () => {
      setPlayingUI(false);
      sendEmbedEvent('pause');
      persistProgress(true);
    });
    video.addEventListener('ended', () => {
      sendEmbedEvent('ended');
      if (currentSourceUrl) removeHistoryEntry(currentSourceUrl);
      advanceAfterEnd();
    });
    video.addEventListener('error', () => {
      if (!mediaReady && playbackMode === 'native') return;
      showLoader(false);
      if (loadTimeout) clearTimeout(loadTimeout);
      if (isDebugMode) setStatus('Failed to load media.');
      sendEmbedEvent('error', { message: 'Video error' });
    });

    video.addEventListener('waiting', () => {
      if (!video.paused) {
        showLoader(true);
        if (waitingTimeout) clearTimeout(waitingTimeout);
        waitingTimeout = setTimeout(() => {
          if (loader.classList.contains('active')) {
            if (isDebugMode) setStatus('Buffering...');
          }
        }, 500);
      }
    });

    video.addEventListener('playing', () => {
      showLoader(false);
      if (waitingTimeout) clearTimeout(waitingTimeout);
      if (isDebugMode) setStatus('');
    });

    video.addEventListener('canplay', () => {
      showLoader(false);
      if (waitingTimeout) clearTimeout(waitingTimeout);
      if (isDebugMode) setStatus('');
    });

    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      updateTimeUI(video.currentTime, video.duration);
      sendEmbedEvent('timeupdate', { currentTime: video.currentTime, duration: video.duration });
      persistProgress();
    });

    seekSlider.addEventListener('input', (e) => {
      isSeeking = true;
      const pct = parseFloat(e.target.value);
      progress.style.width = pct + '%';
      const duration = playbackMode === 'native' ? video.duration : knownDuration;
      if (duration) {
        const time = (pct / 100) * duration;
        timeEl.textContent = `${Utils.formatTime(time)} / ${Utils.formatTime(duration)}`;
      }
    });

    seekSlider.addEventListener('change', (e) => {
      isSeeking = false;
      const pct = parseFloat(e.target.value);
      const duration = playbackMode === 'native' ? video.duration : knownDuration;
      if (!duration) return;
      const time = (pct / 100) * duration;
      if (playbackMode === 'youtube') {
        if (ytPlayer) ytPlayer.seekTo(time, true);
      } else if (playbackMode === 'vimeo') {
        if (vimeoPlayer) vimeoPlayer.setCurrentTime(time);
      } else {
        video.currentTime = time;
        showLoader(true);
      }
    });

    btnPlay.addEventListener('click', togglePlay);
    playBig.addEventListener('click', togglePlay);

    btnRewind.addEventListener('click', () => {
      if (playbackMode === 'youtube') {
        if (!ytPlayer) return;
        ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
      } else if (playbackMode === 'vimeo') {
        if (!vimeoPlayer) return;
        vimeoPlayer.getCurrentTime().then((t) => vimeoPlayer.setCurrentTime(Math.max(0, t - 10)));
      } else {
        video.currentTime = Math.max(0, video.currentTime - 10);
        if (!video.paused) showLoader(true);
      }
    });

    btnForward.addEventListener('click', () => {
      if (playbackMode === 'youtube') {
        if (!ytPlayer) return;
        const dur = ytPlayer.getDuration() || knownDuration;
        ytPlayer.seekTo(Math.min(dur, ytPlayer.getCurrentTime() + 10), true);
      } else if (playbackMode === 'vimeo') {
        if (!vimeoPlayer) return;
        Promise.all([vimeoPlayer.getCurrentTime(), vimeoPlayer.getDuration()]).then(([t, d]) => {
          vimeoPlayer.setCurrentTime(Math.min(d, t + 10));
        });
      } else {
        video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
        if (!video.paused) showLoader(true);
      }
    });

    btnMute.addEventListener('click', () => {
      if (playbackMode === 'youtube') {
        if (!ytPlayer) return;
        const muted = ytPlayer.isMuted();
        if (muted) ytPlayer.unMute(); else ytPlayer.mute();
        setIcon(btnMute, muted ? 'volume-high' : 'volume-xmark');
      } else if (playbackMode === 'vimeo') {
        if (!vimeoPlayer) return;
        vimeoPlayer.getMuted().then((muted) => {
          vimeoPlayer.setMuted(!muted);
          setIcon(btnMute, muted ? 'volume-high' : 'volume-xmark');
        });
      } else {
        video.muted = !video.muted;
        setIcon(btnMute, video.muted ? 'volume-xmark' : 'volume-high');
      }
    });

    volSlider.addEventListener('input', () => {
      const v = parseFloat(volSlider.value);
      if (playbackMode === 'youtube') {
        if (ytPlayer) ytPlayer.setVolume(v * 100);
      } else if (playbackMode === 'vimeo') {
        if (vimeoPlayer) vimeoPlayer.setVolume(v);
      } else {
        video.volume = v;
      }
    });

    btnSpeed.addEventListener('click', cycleSpeed);

    btnFs.addEventListener('click', toggleFullscreenMode);

    if (btnDownload) {
      btnDownload.addEventListener('click', async () => {
        if (!currentSourceUrl) {
          showToast('Nothing loaded yet');
          return;
        }
        if (playbackMode === 'youtube' || playbackMode === 'vimeo' || playbackMode === 'iframe') {
          showToast('Embeds can\'t be downloaded here');
          return;
        }
        if (btnDownload.disabled) return;

        const icon = btnDownload.querySelector('i');
        const originalClass = icon ? icon.className : '';
        btnDownload.disabled = true;
        if (icon) icon.className = 'fa-solid fa-spinner up-spin';
        showToast('Starting download…', 0);

        const downloader = new Downloader({
          proxyBase: '/proxy',
          onProgress: ({ percent }) => {
            if (typeof percent === 'number') showToast(`Downloading… ${percent}%`, 0);
          },
          onComplete: () => {
            showToast('Saved to your downloads');
            if (icon) icon.className = originalClass;
            btnDownload.disabled = false;
          },
          onError: () => {
            showToast('Download failed — try again');
            if (icon) icon.className = originalClass;
            btnDownload.disabled = false;
          }
        });

        try {
          await downloader.download(currentSourceUrl, Utils.getFileName(currentSourceUrl));
        } catch (err) {
          if (icon) icon.className = originalClass;
          btnDownload.disabled = false;
        }
      });
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) exitFullscreenLayout();
      else enterFullscreenLayout();
    });

    btnQuality.addEventListener('click', () => toggleMenu(popupMenus[0]));
    btnSubs.addEventListener('click', () => toggleMenu(popupMenus[1]));

    document.addEventListener('click', (event) => {
      if (popupMenus.every((entry) => entry.menu.hidden)) return;
      if (popupMenus.some((entry) => entry.menu.contains(event.target) || entry.button.contains(event.target))) return;
      closeMenus();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMenus();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') persistProgress(true);
    });
    window.addEventListener('beforeunload', () => persistProgress(true));

    urlLoad.addEventListener('click', () => loadSingle(urlInput.value.trim(), false));
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadSingle(urlInput.value.trim(), false); });
    btnPrev.addEventListener('click', playPrevious);
    btnNext.addEventListener('click', () => playNext(true));

    const params = new URLSearchParams(window.location.search);
    const themeParam = params.get('theme');
    const resolvedTheme = themeParam === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : themeParam;
    if (resolvedTheme === 'light') document.documentElement.dataset.theme = 'light';

    const sourceParam = params.get('source') || params.get('url');
    const autoplayParam = params.get('autoplay') === 'true';
    const debugParam = params.get('debug') === 'true';

    if (debugParam || params.get('debug') === '') {
      setDebugMode(true);
    }

    if (params.get('downloads') === 'false' && btnDownload) {
      btnDownload.hidden = true;
    }

    const initialSources = [];
    const initialSubtitles = [];
    try {
      const parsedSources = JSON.parse(params.get('sources') || '[]');
      if (Array.isArray(parsedSources)) {
        parsedSources.forEach((item) => {
          const value = typeof item === 'string' ? item : (item && (item.source || item.src || item.url));
          if (typeof value === 'string' && value.trim()) {
            initialSources.push(value.trim());
            initialSubtitles.push(item && typeof item === 'object' ? normalizeSubtitles(item.subtitles) : []);
          }
        });
      }
    } catch (err) {}
    if (sourceParam && !initialSources.includes(sourceParam)) {
      initialSources.unshift(sourceParam);
      initialSubtitles.unshift([]);
    }

    let globalSubtitles = [];
    try {
      globalSubtitles = normalizeSubtitles(JSON.parse(params.get('subtitles') || '[]'));
    } catch (err) {}

    if (initialSources.length) {
      playlist = initialSources;
      playlistIndex = Math.max(0, initialSources.indexOf(sourceParam));
      initialSubtitles[playlistIndex] = (initialSubtitles[playlistIndex] || []).concat(globalSubtitles);
      playlistSubtitles = initialSubtitles;
      playTrack(autoplayParam);
    } else {
      setTimeout(() => {
        sendReadyIfNeeded();
        showLoader(false);
      }, 300);
      if (!debugParam) setStatus('');
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (/^https?:\/\//.test(event.origin)) parentOrigin = event.origin;
      const data = event.data;
      if (!data || data.type !== 'uniplayos') return;
      switch (data.action) {
        case 'play':
          if (playbackMode === 'youtube') { if (ytPlayer) ytPlayer.playVideo(); }
          else if (playbackMode === 'vimeo') { if (vimeoPlayer) vimeoPlayer.play(); }
          else { safePlay(); }
          break;
        case 'pause':
          if (playbackMode === 'youtube') { if (ytPlayer) ytPlayer.pauseVideo(); }
          else if (playbackMode === 'vimeo') { if (vimeoPlayer) vimeoPlayer.pause(); }
          else { video.pause(); }
          break;
        case 'togglePlay': togglePlay(); break;
        case 'seek':
          if (data.time !== undefined) {
            if (playbackMode === 'youtube') {
              if (ytPlayer) ytPlayer.seekTo(data.time, true);
            } else if (playbackMode === 'vimeo') {
              if (vimeoPlayer) vimeoPlayer.setCurrentTime(data.time);
            } else {
              video.currentTime = data.time;
              if (!video.paused) showLoader(true);
            }
          }
          break;
        case 'setVolume':
          if (data.level !== undefined) {
            const v = Math.max(0, Math.min(1, data.level));
            volSlider.value = v;
            if (playbackMode === 'youtube') { if (ytPlayer) ytPlayer.setVolume(v * 100); }
            else if (playbackMode === 'vimeo') { if (vimeoPlayer) vimeoPlayer.setVolume(v); }
            else { video.volume = v; }
          }
          break;
        case 'toggleMute':
          if (playbackMode === 'youtube') {
            if (ytPlayer) {
              const muted = ytPlayer.isMuted();
              if (muted) ytPlayer.unMute(); else ytPlayer.mute();
              setIcon(btnMute, muted ? 'volume-high' : 'volume-xmark');
            }
          } else if (playbackMode === 'vimeo') {
            if (vimeoPlayer) {
              vimeoPlayer.getMuted().then((muted) => {
                vimeoPlayer.setMuted(!muted);
                setIcon(btnMute, muted ? 'volume-high' : 'volume-xmark');
              });
            }
          } else {
            video.muted = !video.muted;
            setIcon(btnMute, video.muted ? 'volume-xmark' : 'volume-high');
          }
          break;
        case 'toggleFullscreen': toggleFullscreenMode(); break;
        case 'setQuality':
          if (quality) {
            if (data.height === 'auto') {
              selectQuality('auto', false);
            } else if (Number.isFinite(Number(data.height))) {
              const entry = pickEntryForHeight(data.height);
              if (entry) selectQuality(entry.index, false);
            }
          }
          break;
        case 'load': if (data.source) loadSingle(data.source, false, normalizeSubtitles(data.subtitles)); break;
        case 'setSubtitle': {
          if (data.lang === 'off') {
            selectSubtitle('off', false);
          } else if (typeof data.lang === 'string') {
            const match = subtitleState.tracks.find((track) => track.lang === data.lang);
            if (match) selectSubtitle(match.key, false);
          }
          break;
        }
        case 'next': playNext(true); break;
        case 'previous': playPrevious(); break;
        case 'destroy':
          persistProgress(true);
          destroyInstances();
          video.pause();
          video.src = '';
          showLoader(false);
          if (loadTimeout) clearTimeout(loadTimeout);
          if (waitingTimeout) clearTimeout(waitingTimeout);
          break;
        case 'setDebug':
          setDebugMode(data.enabled === true);
          break;
        case 'setPlaybackRate':
          if (data.rate !== undefined) setPlaybackSpeed(data.rate);
          break;
        default: break;
      }
    });
  })();
</script>
</body>
